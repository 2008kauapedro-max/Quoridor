<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quoridor Arena">
  <title>Quoridor Arena</title>

  <defs>
    <!-- madeira da moldura -->
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#b07a42"/>
      <stop offset=".55" stop-color="#8a5a2e"/>
      <stop offset="1"   stop-color="#6f4520"/>
    </linearGradient>
    <!-- casas claras -->
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#efe6d2"/>
    </linearGradient>
    <!-- bolinha vermelha -->
    <radialGradient id="red" cx=".35" cy=".3" r="1">
      <stop offset="0"   stop-color="#ffc2b8"/>
      <stop offset=".45" stop-color="#e0453a"/>
      <stop offset="1"   stop-color="#992219"/>
    </radialGradient>
    <!-- bolinha azul -->
    <radialGradient id="blue" cx=".35" cy=".3" r="1">
      <stop offset="0"   stop-color="#b8dcff"/>
      <stop offset=".45" stop-color="#2f7fd6"/>
      <stop offset="1"   stop-color="#184a80"/>
    </radialGradient>
  </defs>

  <!-- moldura de madeira arredondada -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#wood)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none"
        stroke="rgba(255,255,255,.25)" stroke-width="10"/>

  <!-- tabuleiro 3x3 -->
  <g fill="url(#cell)">
    <rect x="50"  y="50"  width="120" height="120" rx="26"/>
    <rect x="196" y="50"  width="120" height="120" rx="26"/>
    <rect x="342" y="50"  width="120" height="120" rx="26"/>
    <rect x="50"  y="196" width="120" height="120" rx="26"/>
    <rect x="196" y="196" width="120" height="120" rx="26"/>
    <rect x="342" y="196" width="120" height="120" rx="26"/>
    <rect x="50"  y="342" width="120" height="120" rx="26"/>
    <rect x="196" y="342" width="120" height="120" rx="26"/>
    <rect x="342" y="342" width="120" height="120" rx="26"/>
  </g>

  <!-- jogadores: azul rumo à base, vermelho rumo ao topo -->
  <circle cx="256" cy="110" r="44" fill="url(#blue)"/>
  <circle cx="256" cy="402" r="44" fill="url(#red)"/>
</svg>